<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
:root{--bg:rgba(24,26,32,.92);--fg:#e8eaf0;--mut:#8b91a0;--line:rgba(255,255,255,.08);--ok:#22c55e;--warn:#facc15;--crit:#ef4444;--acc:#6aa3ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;padding:0;background:transparent;overflow:hidden;font:12px/1.35 "Segoe UI Variable","Segoe UI",sans-serif;color:var(--fg);user-select:none}
.card{height:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.hd{display:flex;align-items:center;gap:7px;font-weight:600;-webkit-app-region:drag}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px currentColor;color:var(--ok)}
.l1 .dot{background:var(--warn);color:var(--warn)}.l2 .dot{background:var(--crit);color:var(--crit)}
.hd small{margin-left:auto;color:var(--mut);font-weight:400}
.row{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px}
.row b{color:var(--mut);font-weight:500;font-size:11px}.row i{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:3px;background:var(--ok);transition:width .4s,background .3s}
.net{display:flex;justify-content:space-between;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11.5px}
.net em{font-style:normal;color:var(--fg)}
.gauge{display:block;margin:0 auto}
.gauge .t{fill:var(--mut);font-size:7px;text-anchor:middle}
#nd,#nu{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.ctl{display:flex;flex-wrap:nowrap;gap:3px;justify-content:space-between;margin-top:-1px;height:18px;white-space:nowrap}
.ctl button{white-space:nowrap}
.seg{display:inline-flex;gap:2px}
.seg button{background:rgba(255,255,255,.07);color:var(--mut);padding:1px 7px;border-radius:5px;font-size:10px;line-height:1.3}
.seg button:hover{background:rgba(255,255,255,.15)}
.seg button.on{background:rgba(106,163,255,.28);color:var(--fg)}
.res{height:66px;cursor:pointer}
.ctl .tst,.ctl .rep{background:rgba(255,255,255,.08);color:var(--fg);padding:1px 7px;border-radius:5px;font-size:10px;line-height:1.3}
.ctl .tst:hover,.ctl .rep:hover{background:rgba(255,255,255,.18)}
.ctl .tst.run{color:#facc15}
.ctl .rep.on{background:rgba(106,163,255,.28)}
.ctl .rep[disabled]{opacity:.35;pointer-events:none}
.ctl .mid{display:inline-flex;gap:3px}
.seg button{padding:1px 6px}
.widget .card{cursor:grab}.widget .hd{-webkit-app-region:no-drag}
/* CPU scanner strip (persistent node, not re-rendered) */
#wtop{display:flex;flex-direction:column;gap:7px}
.scan{border-top:1px solid var(--line);padding-top:5px;display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--mut)}
.sc-gr{position:relative;height:24px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.04)}
.sc-gr svg{display:block;width:100%;height:100%}
.sc-gr .beam{position:absolute;top:0;bottom:0;left:-12%;width:12%;background:linear-gradient(90deg,transparent,rgba(106,163,255,.55));border-right:1px solid rgba(160,200,255,.9);animation:sweep 3.6s steps(36) infinite}
@keyframes sweep{from{left:-12%}to{left:100%}}
.scan.fl .sc-gr{animation:flash .7s steps(7) 1}
@keyframes flash{0%{box-shadow:inset 0 0 0 1px var(--acc),0 0 8px var(--acc)}100%{box-shadow:inset 0 0 0 1px transparent}}
.sc-ft{display:flex;align-items:center;gap:6px;height:16px;white-space:nowrap}
.sc-ft #scl{color:var(--fg);font-variant-numeric:tabular-nums;margin-right:auto}
.sc-gr #scn{position:absolute;right:4px;top:1px;font-size:9px;color:var(--mut);text-shadow:0 0 3px #000}
.sc-ft select{color-scheme:dark;font:inherit;font-size:10px;border:0;border-radius:5px;padding:1px 2px;background:#262a33;color:var(--fg);cursor:pointer}
.hog{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 6px;padding:4px 6px;border-radius:7px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--fg)}
.hog .ht{flex:1 1 100%;min-width:0;line-height:1.3}.hog .ht b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hog .ht span{color:var(--mut)}
.hog button{font-size:10px;padding:1px 6px;white-space:nowrap}
.hog button.later{background:rgba(255,255,255,.08);color:var(--fg)}.hog button.later:hover{background:rgba(255,255,255,.18)}
/* panel */
.panel .card{padding:14px;gap:10px}
.panel .hd{font-size:14px}.panel .x{margin-left:auto;cursor:pointer;color:var(--mut);padding:0 4px;-webkit-app-region:no-drag}
.status{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
#app{height:100%}
.card{overflow:hidden}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;display:flex;flex-direction:column;gap:8px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
h4{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-top:2px}
.grp{background:rgba(255,255,255,.04);border-radius:10px;padding:6px 8px}
.grp>summary{display:flex;gap:8px;cursor:pointer;list-style:none;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .n{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp>summary .m{color:var(--mut);font-variant-numeric:tabular-nums}
.p{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--line)}
.p:first-of-type{margin-top:6px}
.p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .nm small{color:var(--mut);margin-left:4px}
.chip{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(106,163,255,.15);color:var(--acc)}
.flag{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(239,68,68,.18);color:#ff8a8a;white-space:nowrap}
.p .v{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
input{font:inherit;font-size:11px;flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:rgba(0,0,0,.25);color:var(--fg);user-select:text}
button.ok{background:rgba(34,197,94,.2);color:#8be3a8}button.ok:hover{background:rgba(34,197,94,.35)}
button{font:inherit;font-size:11px;border:0;border-radius:6px;padding:2px 8px;background:rgba(239,68,68,.2);color:#ff9a9a;cursor:pointer}
button:hover{background:rgba(239,68,68,.35)}
.sus{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.07)}
.ss{display:flex;gap:8px;align-items:center;padding:2px 0}.ss .nm{flex:1}.ss .v{color:var(--mut)}
.on{width:7px;height:7px;border-radius:50%;background:var(--ok)}.off{width:7px;height:7px;border-radius:50%;background:#555}
.empty{color:var(--mut);padding:4px 0}
/* Focus block */
.fz{border-top:1px solid var(--line);padding-top:5px;display:flex;flex-direction:column;gap:3px;font-size:11px}
.fr{display:flex;align-items:center;gap:6px;min-width:0}
.fr>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr.dn>span,.ss.dn .nm{color:var(--mut);text-decoration:line-through}
.fr.mt{color:var(--mut)}
button.ck{width:15px;height:15px;padding:0;border-radius:4px;background:rgba(255,255,255,.08);color:#8be3a8;border:1px solid var(--line);font-size:10px;line-height:1;flex:none}
button.ck:hover{background:rgba(34,197,94,.3)}
.dn button.ck{background:rgba(34,197,94,.3)}
button.gh{background:rgba(255,255,255,.08);color:var(--fg)}button.gh:hover{background:rgba(255,255,255,.18)}
.hbs{display:flex;flex-wrap:wrap;gap:3px}
button.hbt{background:rgba(255,255,255,.07);color:var(--mut);font-size:10px;padding:1px 6px;border-radius:8px}
button.hbt.dn{background:rgba(34,197,94,.2);color:#8be3a8}
.ph{color:var(--mut);font-size:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph.urg{color:#ffd27a}
.wk{display:inline-flex;gap:2px}.wk i{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.12)}.wk i.wd{background:var(--ok)}
.fz-add{display:flex;gap:4px;margin-top:4px}
.ss.nx .nm{color:var(--fg)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--mut);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;min-height:16px}
.cnt{color:var(--fg);font-variant-numeric:tabular-nums}
.fr button:not(.ck){font-size:10px;padding:1px 5px;white-space:nowrap;flex:none}
button.tx,.fr button.tx{flex:1;min-width:0;background:none;color:var(--fg);padding:0;text-align:left;line-height:1.3;font-size:11px;white-space:normal}button.tx:hover{background:rgba(255,255,255,.06)}
.fz>button.tx{flex:none}
button.tx b{display:block;font-weight:600}button.tx span{display:block;color:var(--mut)}
button.run{background:rgba(250,204,21,.2);color:#facc15;font-variant-numeric:tabular-nums}button.run:hover{background:rgba(250,204,21,.35)}
.pm{color:var(--mut);white-space:nowrap}
#w{position:relative}
.boot{position:absolute;inset:0;z-index:5;background:#181a20;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 22px;cursor:grab}
.boot b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}.boot .bar{width:100%}.boot .bar span{background:var(--acc);width:1%;transition:width .1s linear}
.boot small{color:var(--mut);text-align:center;min-height:15px}
.seg button.sel{background:rgba(106,163,255,.28);color:var(--fg)}
</style></head>
<body><div id="app"></div>
<script>
const view = new URLSearchParams(location.search).get('view');
document.body.className = view;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtB = v => v > 1048576 ? (v / 1048576).toFixed(1) + ' МБ/с' : v > 1024 ? (v / 1024).toFixed(0) + ' КБ/с' : v.toFixed(0) + ' Б/с';
const fmtMem = m => m >= 1024 ? (m / 1024).toFixed(1) + ' ГБ' : m + ' МБ';
const fmtAge = m => m >= 1440 ? Math.floor(m / 1440) + 'д' : m >= 60 ? Math.floor(m / 60) + 'ч' : m + 'м';
const col = (v, c) => v >= c.crit ? 'var(--crit)' : v >= c.warn ? 'var(--warn)' : 'var(--ok)';
const metric = (n, v, c) => v == null ? '' : `<div class="row"><b>${n}</b><div class="bar"><span style="width:${Math.min(100, v)}%;background:${col(v, c)}"></span></div><i>${v.toFixed(0)}%</i></div>`;
// Network indicator: 3 styles (dial / graph / bars) x 3 channels (both / download / upload).
// Log scale 1 KB/s .. 100 MB/s; the dial and bars follow the average of the last ~4.5 s.
const lsGet = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let gStyle = lsGet('pcm.style', 'dial'), gCh = lsGet('pcm.ch', 'both');
const samples = [], hist = [];
let prevD = 0, prevU = 0, prevBD = 0, prevBU = 0, lastSeq = null, lastH = 0;
const C_D = '#e8eaf0', C_U = '#6aa3ff', BARW = 130;
function pushSample(rx, tx) { const now = Date.now(); samples.push({ t: now, rx, tx }); while (samples[0].t < now - 4500) samples.shift(); hist.push({ rx, tx }); if (hist.length > 90) hist.shift(); }
const avgOf = k => samples.reduce((a, x) => a + x[k], 0) / samples.length;
const posOf = v => Math.max(0, Math.min(1, Math.log10(Math.max(v, 1000) / 1000) / 5));
const showD = () => gCh !== 'tx', showU = () => gCh !== 'rx';
const CX = 100, CY = 54, R = 44;
const pt = (p, r) => { const a = Math.PI * (1 - p); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; };
function dialSvg(dDeg, uDeg) {
  let ticks = '';
  [['1K', 0], ['10K', .2], ['100K', .4], ['1M', .6], ['10M', .8], ['100M', 1]].forEach(([l, p]) => { const [x1, y1] = pt(p, R - 1), [x2, y2] = pt(p, R + 4), [tx, ty] = pt(p, R + 11); ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8b91a0" stroke-width="1"/><text class="t" x="${tx}" y="${ty + 2}">${l}</text>`; });
  const arc = (a, b, c) => { const [x1, y1] = pt(a, R), [x2, y2] = pt(b, R); return `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55"/>`; };
  const single = gCh !== 'both';
  const needle = (id, deg, len, color, w) => `<g id="${id}" style="transform-origin:${CX}px ${CY}px;transform:rotate(${deg}deg)"><line x1="${CX}" y1="${CY}" x2="${CX - len}" y2="${CY}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/></g>`;
  const label = single ? `<text x="${CX}" y="63" text-anchor="middle" font-size="8" fill="${gCh === 'rx' ? C_D : C_U}">${gCh === 'rx' ? '↓' : '↑'} ${fmtB(avgOf(gCh))}</text>` : '';
  return `<svg class="gauge" width="206" height="66" viewBox="0 0 200 64">${arc(0, .6, '#22c55e')}${arc(.6, .85, '#facc15')}${arc(.85, 1, '#ef4444')}${ticks}
  ${showU() ? needle('nu', uDeg, single ? 40 : 34, C_U, single ? 2 : 1.3) : ''}${showD() ? needle('nd', dDeg, 40, C_D, 2) : ''}
  <circle cx="${CX}" cy="${CY}" r="3.5" fill="${single && gCh === 'tx' ? C_U : C_D}"/>${label}</svg>`;
}
function graphSvg() {
  const T = 12, B = 60, N = 90, chs = [];
  if (showD()) chs.push(['rx', C_D]); if (showU()) chs.push(['tx', C_U]);
  let max = 10240; for (const [k] of chs) for (const h of hist) if (h[k] > max) max = h[k];
  const series = k => hist.map((h, i) => { const a = hist.slice(Math.max(0, i - 1), i + 2); return a.reduce((s, x) => s + x[k], 0) / a.length; });
  let g = `<line x1="2" y1="${B}" x2="198" y2="${B}" stroke="rgba(255,255,255,.15)"/><line x1="2" y1="${(B + T) / 2}" x2="198" y2="${(B + T) / 2}" stroke="rgba(255,255,255,.07)" stroke-dasharray="2 3"/>`;
  for (const [k, c] of chs) {
    const v = series(k); if (v.length < 2) continue;
    const pts = v.map((y, i) => [2 + (N - v.length + i) / (N - 1) * 196, B - y / max * (B - T)]);
    const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
    if (chs.length === 1) g += `<path d="${d}L${pts[pts.length - 1][0].toFixed(1)} ${B}L${pts[0][0].toFixed(1)} ${B}Z" fill="${c}" opacity=".15"/>`;
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<text class="t" x="3" y="8" style="text-anchor:start">макс ${fmtB(max)}</text><text class="t" x="197" y="8" style="text-anchor:end">≈3 мин</text>`;
  return `<svg class="gauge" width="206" height="66" viewBox="0 0 200 64">${g}</svg>`;
}
function barsSvg(bd, bu) {
  const rows = [];
  if (showD()) rows.push(['bd', '↓', C_D, bd, 'rx']); if (showU()) rows.push(['bu', '↑', C_U, bu, 'tx']);
  const one = rows.length === 1, bh = one ? 15 : 10, gap = one ? 0 : 6, y0 = one ? 14 : 8;
  let g = '';
  rows.forEach((r, i) => {
    const y = y0 + i * (bh + gap);
    g += `<text x="2" y="${y + bh - 2}" fill="${r[2]}" font-size="${one ? 13 : 10}">${r[1]}</text><rect x="16" y="${y}" width="${BARW}" height="${bh}" rx="${bh / 2}" fill="rgba(255,255,255,.08)"/><rect id="${r[0]}" x="16" y="${y}" width="${r[3] * BARW}" height="${bh}" rx="${bh / 2}" fill="${r[2]}" opacity=".85" style="transition:width 1.2s cubic-bezier(.2,.8,.2,1)"/><text x="198" y="${y + bh - 2}" text-anchor="end" fill="${C_D}" font-size="${one ? 10 : 8}">${fmtB(avgOf(r[4]))}</text>`;
  });
  [['1K', 0], ['1M', .6], ['100M', 1]].forEach(([l, p]) => { g += `<text class="t" x="${16 + p * BARW}" y="62" style="text-anchor:${p === 0 ? 'start' : p === 1 ? 'end' : 'middle'}">${l}</text>`; });
  return `<svg class="gauge" width="206" height="66" viewBox="0 0 200 64">${g}</svg>`;
}
const netControls = st => `<div class="ctl"><span class="seg">${[['both', '↓↑', 'Скачивание и отправка'], ['rx', '↓', 'Только скачивание'], ['tx', '↑', 'Только отправка']].map(([v, t, h]) => `<button data-ch="${v}" title="${h}" class="${gCh === v ? 'on' : ''}">${t}</button>`).join('')}</span>${speedControls(st)}<span class="seg">${[['dial', '◔', 'Стрелка'], ['graph', '⌇', 'График'], ['bars', '▤', 'Полосы']].map(([v, t, h]) => `<button data-gs="${v}" title="${h}" class="${gStyle === v ? 'on' : ''}">${t}</button>`).join('')}</span></div>`;
// ---- internet speed test: two analog dials (download = "чтение", upload = "передача"), stage by stage ----
let reportOpen = false, dismissedAt = 0, prevSD = 0, prevSU = 0;
const posM = v => Math.max(0, Math.min(1, Math.log10(Math.max(v || 0, 1)) / 3));   // 1 .. 1000 Mbit/s, log scale
const fmtMb = v => v == null ? '—' : (v >= 100 ? String(Math.round(v)) : v.toFixed(1).replace('.', ','));
const ptc = (cx, cy, r, p) => { const a = Math.PI * (1 - p); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
function miniDial(cx, id, deg, color, title, val, dim) {
  const cy = 50, r = 29, [x1, y1] = ptc(cx, cy, r, 0), [x2, y2] = ptc(cx, cy, r, 1);
  let ticks = '';
  [[0, '1'], [1 / 3, '10'], [2 / 3, '100'], [1, '1000']].forEach(([p, l]) => { const [a, b] = ptc(cx, cy, r - 1, p), [c, d] = ptc(cx, cy, r + 4, p), [tx, ty] = ptc(cx, cy, r + 9, p); ticks += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#8b91a0" stroke-width=".8"/><text class="t" style="font-size:5.5px" x="${tx}" y="${ty + 2}">${l}</text>`; });
  return `<g opacity="${dim ? .35 : 1}"><text x="${cx}" y="19" text-anchor="middle" font-size="7.5" fill="${color}">${title}</text>
  <path d="M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}" stroke="${color}" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".35"/>${ticks}
  <g id="${id}" style="transform-origin:${cx}px ${cy}px;transform:rotate(${deg}deg);transition:transform 1s cubic-bezier(.2,.8,.2,1)"><line x1="${cx}" y1="${cy}" x2="${cx - 25}" y2="${cy}" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></g>
  <circle cx="${cx}" cy="${cy}" r="3" fill="${color}"/><text x="${cx}" y="62" text-anchor="middle" font-size="8.5" fill="${C_D}">${val}</text></g>`;
}
function speedModel(st) {
  const r = st.result || {}, p = st.partial || {};
  let down = null, up = null, stage = '', dDim = false, uDim = false;
  if (st.running) {
    if (st.phase === 'ping') { stage = 'Этап 1/3 · Пинг…'; dDim = uDim = true; }
    else if (st.phase === 'down') { stage = `Этап 2/3 · Чтение (скачивание) · пинг ${p.pingMs} мс`; down = st.live; uDim = true; }
    else { stage = 'Этап 3/3 · Передача (отправка)'; down = p.down; up = st.live; }
  } else if (r.error) { stage = r.error; dDim = uDim = true; }
  else { stage = `Готово · пинг ${r.pingMs} мс · джиттер ${r.jitterMs} мс`; down = r.down; up = r.up; }
  return { down, up, stage, dDim, uDim };
}
function speedView(st) {
  const m = speedModel(st), tgtD = posM(m.down) * 180, tgtU = posM(m.up) * 180;
  const html = `<svg class="gauge" width="212" height="66" viewBox="0 0 200 64"><text x="100" y="8" text-anchor="middle" font-size="7.5" fill="#8b91a0">${esc(m.stage)}</text>
  ${miniDial(50, 'sd', prevSD, C_D, '↓ Чтение', m.down == null ? '—' : fmtMb(m.down) + ' Мбит/с', m.dDim)}${miniDial(150, 'su', prevSU, C_U, '↑ Передача', m.up == null ? '—' : fmtMb(m.up) + ' Мбит/с', m.uDim)}</svg>`;
  return { html, tgtD, tgtU };

    h += f.frogs.map(x => `<div class="ss ${x.done ? 'dn' : ''}">${fzb('frogToggle', x.id, x.done ? '✓' : '', 'ck')}${fzEd('frog', x.id, x.t)}${frogCtl(f, x)}${fzb('frogRemove', x.id, '✕')}</div>`).join('');
    if (f.frogs.length < o.frogsMax) h += addRow('frog', 'Самая неприятная задача на сегодня', 'frogAdd');
    h += `<div class="ss"><span class="nm" style="color:var(--mut)">Съедено за 7 дней: ${f.frogsWeek}</span></div>`;
  }
  if (o.lang) h += `<h4>Изучаем язык · слов за день / месяц: ${f.learned.day}/${f.learned.month}</h4><div class="ss">${reveal('wd', f.word)}${wordCtl()}</div>`;
  if (o.habits) {
    h += '<h4>Привычки</h4>';
    for (const b of f.habits) {
      const extra = b.phrases ? sentenceRow(f) : '';
      h += `<div class="ss ${b.doneToday ? 'dn' : ''}">${fzb('habitToggle', b.id, b.doneToday ? '✓' : '', 'ck')}${fzEd('habit', b.id, b.t, { min: b.min, html: `${esc(b.t)} <small style="color:var(--mut)">${b.min} мин</small>` })}<span class="wk" title="последние 7 дней">${b.week.map(d => `<i class="${d ? 'wd' : ''}"></i>`).join('')}</span><span class="v">${b.streak ? '🔥' + b.streak : '—'}</span>${fzDel('habitRemove', b.id)}</div>` + extra;
    }
    h += `<div class="fz-add"><input data-fi="habit" maxlength="40" placeholder="Новая привычка"><input data-fi="habitmin" type="number" min="1" max="240" value="15" style="flex:0 0 46px" title="минут в день"><button class="ok" data-fadd="habitAdd" data-fkey="habit">+</button></div>`;
  }
  if (o.goals) {
    h += '<h4>Цели</h4>';
    h += f.goals.map(g => {
      const gd = `data-goal="${esc(g.id)}"`;
      return `<details class="grp" data-k="g:${esc(g.id)}" ${open.has('g:' + g.id) ? 'open' : ''} style="margin-bottom:4px"><summary><span class="n">${esc(g.t)}</span><span class="m">${g.done}/${g.total} · ${g.pct}%</span></summary>
      <div class="bar" style="margin:5px 0"><span style="width:${g.pct}%;background:var(--acc)"></span></div>
      ${g.subs.map((s, i) => `<div class="ss ${s.done ? 'dn' : ''}${g.next === s.id ? ' nx' : ''}">${fzb('subToggle', s.id, s.done ? '✓' : '', 'ck', gd)}${fzEd('sub', s.id, s.t, { goal: g.id, html: esc(s.t) + (g.next === s.id ? ' <small style="color:var(--acc)">← следующий</small>' : '') })}${!s.done && !s.frog ? fzb('subToFrog', s.id, '🐸', 'gh', gd + ' title="Сделать лягушкой дня"') : ''}${i > 0 ? fzb('subMove', s.id, '↑', 'gh', gd + ' data-dir="-1"') : ''}${i < g.subs.length - 1 ? fzb('subMove', s.id, '↓', 'gh', gd + ' data-dir="1"') : ''}${fzb('subRemove', s.id, '✕', '', gd)}</div>`).join('')}
      ${addRow('sub:' + g.id, 'Следующий шаг', 'subAdd', gd)}
      <div class="ss" style="margin-top:4px">${fzEd('goal', g.id, g.t, { html: '<span style="color:var(--mut)">Название цели</span>' })}${fzDel('goalRemove', g.id)}</div></details>`;
    }).join('');
    h += addRow('goal', 'Новая цель', 'goalAdd');
  }
  return h + '</details>';
}
function focusSettings(f, open) {   // sits at the very bottom of the panel list
  if (!f || !f.opts || !f.enabled) return '';
  const o = f.opts;
  const chk = (k, t) => `<label class="ss"><input type="checkbox" data-fset="${k}" ${o[k] ? 'checked' : ''} style="flex:none;width:14px"><span class="nm">${t}</span></label>`;
  const seg = (k, vals, unit) => `<div class="ss"><span class="nm">${unit[0]}</span><span class="seg">${vals.map(v => `<button class="${o[k] === v ? 'sel' : ''}" data-fsetv="${k}" data-v="${v}">${v}</button>`).join('')}</span></div>`;
  return `<details class="grp" data-k="fzset" ${open.has('fzset') ? 'open' : ''}><summary><span class="n">Настройки блока «Фокус»</span></summary>
    ${chk('enabled', 'Показывать блок «Фокус»')}${chk('phrase', 'Мотиватор дня')}${chk('frogs', 'Съесть лягушку')}${chk('lang', 'Изучаем язык')}${chk('habits', 'Привычки')}${chk('goals', 'Цель дня и цели')}${chk('notify', 'Напоминание (уведомление Windows)')}
    ${seg('frogsMax', [1, 2, 3, 4, 5], ['Лягушек в день'])}${seg('remindHour', [10, 12, 14, 16, 18], ['Напоминать с, ч'])}</details>`;
}
const STATUS = ['Всё в порядке', 'Повышенная нагрузка', 'Перегрузка'];

function render(d) {
  lastD = d;
  if (view === 'panel' && document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type !== 'checkbox') return;   // don't wipe a key being typed
  const { stats: s, level, worst, analysis: a, cfg, usage: us } = d, c = cfg;
  const m = metric('CPU', s.cpu, c) + metric('RAM', s.ram, c) + metric('GPU', s.gpu, c) + metric('Диск', s.disk, { warn: 85, crit: 95 });
  if (view === 'widget') {
    bootState = d.boot || bootState;
    if (bootPct < 2 && Date.now() - bootFrom < 800 && BOOT.every(([k]) => bootState[k])) { const el = $('#boot'); if (el) el.remove(); }   // re-created widget: everything is already known
    if (d.seq !== lastSeq) { pushSample(s.rx, s.tx); lastSeq = d.seq; }
    const st = d.speedtest || {};
    const showSpeed = st.running || (st.result && ((reportOpen) || (st.result.at !== dismissedAt && Date.now() - st.result.at < 25000)));
    const sv = showSpeed ? speedView(st) : null;
    const pd = posOf(avgOf('rx')), pu = posOf(avgOf('tx'));
    const ind = sv ? `<div class="res" data-dismiss="1">${sv.html}</div>` : gStyle === 'graph' ? graphSvg() : gStyle === 'bars' ? barsSvg(prevBD, prevBU) : dialSvg(prevD, prevU);
    $('#w').className = 'card l' + level;
    $('#wtop').innerHTML = `<div class="hd"><span class="dot"></span>PC Monitor<small>${level ? esc(worst.name) + ' ' + worst.v.toFixed(0) + '%' : 'ОК'}</small></div>${m}<div class="net"><span>↓ <em>${fmtB(s.rx)}</em></span><span>↑ <em>${fmtB(s.tx)}</em></span></div>${ind}${netControls(st)}${focusStrip(d.focus)}`;
    updateScan(d);
    const anim = (el, fn) => { if (el) { el.getBoundingClientRect(); fn(el); } };   // reflow first so the CSS transition runs from the previous value
    if (sv) { anim($('#sd'), e => { e.style.transform = `rotate(${sv.tgtD}deg)`; }); anim($('#su'), e => { e.style.transform = `rotate(${sv.tgtU}deg)`; }); prevSD = sv.tgtD; prevSU = sv.tgtU; }
    if (!sv && gStyle === 'dial') { anim($('#nd'), e => { e.style.transform = `rotate(${pd * 180}deg)`; }); anim($('#nu'), e => { e.style.transform = `rotate(${pu * 180}deg)`; }); }
    if (!sv && gStyle === 'bars') { anim($('#bd'), e => { e.style.width = pd * BARW + 'px'; }); anim($('#bu'), e => { e.style.width = pu * BARW + 'px'; }); }
    prevD = pd * 180; prevU = pu * 180; prevBD = pd; prevBU = pu;
    // fit the window to the content so no mode (dial, graph, speed test...) can clip the bottom row
    const card = $('#w'); card.style.height = 'auto'; const need = Math.ceil(card.offsetHeight) + 2; card.style.height = '';
    if (need !== lastH) { lastH = need; api.widgetSize(need); }
    return;
  }
  const sus = a ? a.suspects : [];
  const proc = (p, k) => `<div class="p"><span class="nm">${esc(p.name)}<small>${p.pid} · ${fmtAge(p.ageMin)}</small></span><span class="chip">${p.cat}</span>${p.flags.map(f => `<span class="flag">${esc(f)}</span>`).join('')}<span class="v">${fmtMem(p.memMB)} · ${p.cpu}%</span><button data-pid="${p.pid}" data-name="${esc(p.name)}" data-mem="${p.memMB}" data-proj="${esc(p.project || '')}">✕</button></div>`;
  const open = new Set([...document.querySelectorAll('details[open]')].map(x => x.dataset.k));
  const sc = $('.scroll'), top = sc ? sc.scrollTop : 0;
  const fd = document.querySelector('details[data-k="focus"]'); if (fd) fzOpen = fd.open;
  const keep = {}; document.querySelectorAll('input[data-fi]').forEach(i => { keep[i.dataset.fi] = i.value; });   // typed-but-not-added text survives a refresh
  $('#app').innerHTML = `<div class="card l${level}"><div class="hd"><span class="dot"></span>PC Monitor<small style="margin:0 auto 0 6px">v${esc(d.version || '')}</small><span class="x" id="x">✕</span></div>
  <div class="status">${STATUS[level]}${level ? ' — ' + esc(worst.name) + ' ' + worst.v.toFixed(0) + '%' : ''} · RAM ${s.ramUsedGB.toFixed(1)} / ${s.ramTotalGB.toFixed(0)} ГБ</div>
  <div class="grid">${m}</div>
  <div class="net"><span>↓ <em>${fmtB(s.rx)}</em></span><span>↑ <em>${fmtB(s.tx)}</em></span></div>
  <div class="scroll">${focusBlock(d.focus, open)}${!a ? '<div class="empty">Сканирую процессы…</div>' : `
    ${sus.length ? `<h4>Подозрительные (${sus.length})</h4><div class="grp sus">${sus.map(proc).join('')}</div>` : ''}
    ${a.llm && (a.llm.tools.length || a.llm.local.length) ? `<h4>LLM: инструменты и модели</h4><div class="grp">
      ${a.llm.local.map(m => `<div class="ss"><span class="on"></span><span class="nm" title="${esc(m.model)}">${esc(m.runtime === 'ollama' ? 'Ollama' : 'LM Studio')} · ${esc(m.model)}</span><span class="v">${m.sizeMB ? fmtMem(m.sizeMB) + (m.vramMB ? ' (GPU ' + fmtMem(m.vramMB) + ')' : '') : 'загружена'}${m.expiresInMin != null ? ' · ещё ' + m.expiresInMin + 'м' : ''}</span>${m.runtime === 'ollama' ? `<button data-unload="${esc(m.model)}" data-rt="ollama">Выгрузить</button>` : ''}</div>`).join('')}
      ${a.llm.tools.map(t => `<div class="ss"><span class="nm">${esc(t.label)}<small style="color:var(--mut);margin-left:4px">${esc(t.kind)}</small></span><span class="v">${t.procs} проц. · ${fmtMem(t.memMB)} · ${t.cpu}% · ${fmtAge(t.ageMin)}</span></div>`).join('')}</div>` : ''}
    ${speedBlock(d.speedtest)}
    ${usageBlock(us, c.budgets)}
    ${spendBlock(d.spend, d.keys, c.budgets)}
    <h4>Проекты и процессы</h4>
    ${a.groups.map(g => `<details class="grp" data-k="${esc(g.key)}" ${open.has(g.key) ? 'open' : ''}><summary><span class="n">${esc(g.name)}</span><span class="m">${g.procs.length} · ${fmtMem(g.memMB)} · ${g.cpu}%</span></summary>${g.procs.map(proc).join('')}</details>`).join('') || '<div class="empty">Нет данных</div>'}
    ${a.browsers.length ? `<h4>Браузеры</h4><div class="grp">${a.browsers.map(b => `<div class="ss"><span class="nm">${esc(b.name)}</span><span class="v">${b.count} проц. · ${fmtMem(b.memMB)} · ${b.cpu.toFixed(0)}%</span></div>`).join('')}</div>` : ''}
    ${a.sessions.length ? `<h4>LLM-сессии (CLI)</h4><div class="grp">${a.sessions.map(x => `<div class="ss"><span class="${x.active ? 'on' : 'off'}"></span><span class="nm" title="${esc(x.cwd)}">${esc(x.name)}<small style="color:var(--mut);margin-left:4px">${esc(x.tool || '')}</small></span><span class="v">${x.active ? 'активна' : fmtAge(Math.round((Date.now() - x.last) / 60000)) + ' назад'}</span></div>`).join('')}</div>` : ''}`}
  ${focusSettings(d.focus, open)}</div></div>`;
  document.querySelectorAll('input[data-fi]').forEach(i => { if (keep[i.dataset.fi] != null && i.dataset.fi !== 'edit' && i.dataset.fi !== 'editmin') i.value = keep[i.dataset.fi]; });
  const ns = $('.scroll'); if (ns) ns.scrollTop = top;
  $('#x').onclick = () => api.closePanel();
}

if (view === 'widget') {
  buildWidget();
  document.addEventListener('contextmenu', e => { e.preventDefault(); api.widgetMenu(); });
  document.addEventListener('dblclick', e => { if (!e.target.closest('.ctl, .res, .scan, .fz button')) api.openPanel(); });
  // drag the widget by any point (JS-based so right-click and double-click keep working)
  let dragging = false;
  document.addEventListener('pointerdown', e => { if (e.button !== 0 || e.target.closest('.ctl, .res, .scan, .fz button')) return; dragging = true; document.body.setPointerCapture(e.pointerId); api.drag('start', e.screenX, e.screenY); });
  document.addEventListener('pointermove', e => { if (dragging) api.drag('move', e.screenX, e.screenY); });
  const end = e => { if (dragging) { dragging = false; api.drag('end', e.screenX, e.screenY); } };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
}
// ---- Focus handlers (same script runs in widget and panel) ----
function fzSay(msg) {
  fzMsg = msg || ''; clearTimeout(fzMsgT); fzMsgT = setTimeout(() => { fzMsg = ''; if (lastD) render(lastD); }, 6000);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (lastD) render(lastD);
}
const fzVal = k => { const i = document.querySelector(`input[data-fi="${k}"]`); return i ? i.value : ''; };
document.addEventListener('keydown', e => {
  if (!e.target.matches || !e.target.matches('input[data-fi]')) return;
  const row = e.target.closest('.fz-add, .ss');
  if (e.key === 'Enter') { const b = row && row.querySelector('button[data-fadd], button[data-fsave]'); if (b) b.click(); }
  else if (e.key === 'Escape' && fzEdit) { fzEdit = ''; e.target.blur(); if (lastD) render(lastD); }
});
document.addEventListener('change', async e => {
  const c = e.target.closest && e.target.closest('input[data-fset]');
  if (c) await api.focusSettings({ [c.dataset.fset]: c.checked });
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-k="focus"]')) fzOpen = e.target.open; }, true);
async function focusClick(e) {
  const T = e.target.closest.bind(e.target);
  const rv = T('button[data-reveal]'); if (rv) { const k = rv.dataset.reveal; shown[k] = shown[k] === rv.dataset.key ? '' : rv.dataset.key; if (lastD) render(lastD); return true; }
  const pb = T('button[data-phr]'); if (pb) { openPhr = openPhr === pb.dataset.phr ? '' : pb.dataset.phr; if (lastD) render(lastD); return true; }
  if (T('button[data-openpanel]')) { api.openPanel(); return true; }
  if (T('button[data-fzon]')) { await api.focusSettings({ enabled: true }); return true; }
  const sv = T('button[data-fsetv]'); if (sv) { await api.focusSettings({ [sv.dataset.fsetv]: +sv.dataset.v }); return true; }
  const ed = T('button[data-fedit]'); if (ed) { fzEdit = ed.dataset.fedit; if (lastD) render(lastD); const i = document.querySelector('input[data-fi="edit"]'); if (i) { i.focus(); i.select(); } return true; }
  const sa = T('button[data-fsave]');
  if (sa) {
    const [kind, id] = sa.dataset.fsave.split(':'), p = { kind, id, goalId: sa.dataset.goal, t: fzVal('edit') };
    if (kind === 'habit') p.min = fzVal('editmin');
    fzEdit = ''; const r = await api.focus('edit', p); if (!r.ok) fzSay(r.msg); else if (lastD) render(lastD); return true;
  }
  const fa = T('button[data-fadd]');
  if (fa) {
    const key = fa.dataset.fkey, t = fzVal(key), p = { t, goalId: fa.dataset.goal };
    if (key === 'habit') p.min = fzVal('habitmin');
    document.querySelectorAll(`input[data-fi="${CSS.escape(key)}"]`).forEach(i => { i.value = ''; });
    const r = await api.focus(fa.dataset.fadd, p);
    if (!r.ok) { fzSay(r.msg); const i = document.querySelector(`input[data-fi="${CSS.escape(key)}"]`); if (i) i.value = t; }
    return true;
  }
  const fz = T('button[data-fz]');
  if (fz) {
    const type = fz.dataset.fz, id = fz.dataset.id;
    if ((type === 'habitRemove' || type === 'goalRemove') && fzArm !== type + id) {   // two-step delete: history/subtasks go with it
      fzArm = type + id; clearTimeout(fzArmT); fzArmT = setTimeout(() => { fzArm = ''; if (lastD) render(lastD); }, 4000); if (lastD) render(lastD); return true;
    }
    fzArm = '';
    const r = await api.focus(type, { id, goalId: fz.dataset.goal, dir: +fz.dataset.dir || 0 });
    if (!r.ok) fzSay(r.msg);
    return true;
  }
  return false;
}
document.addEventListener('click', async e => {
  if (await focusClick(e)) return;
  if (e.target.closest('button[data-speed]')) { api.speedStart(); return; }
  if (e.target.closest('button[data-report]')) { reportOpen = !reportOpen; if (reportOpen) dismissedAt = 0; if (lastD) render(lastD); return; }
  if (e.target.closest('[data-dismiss]')) { const st = lastD && lastD.speedtest; if (st && !st.running) { dismissedAt = st.result ? st.result.at : 0; reportOpen = false; if (lastD) render(lastD); } return; }
  const chb = e.target.closest('button[data-ch]');
  if (chb) { gCh = chb.dataset.ch; lsSet('pcm.ch', gCh); closeSpeed(); if (lastD) render(lastD); return; }
  const gsb = e.target.closest('button[data-gs]');
  if (gsb) { gStyle = gsb.dataset.gs; lsSet('pcm.style', gStyle); closeSpeed(); if (lastD) render(lastD); return; }
  const sv = e.target.closest('button[data-keysave]');
  if (sv) { const p = sv.dataset.keysave, inp = document.querySelector(`input[data-keyin="${p}"]`); const key = inp ? inp.value : ''; if (inp) inp.value = ''; sv.disabled = true; const r = await api.setKey(p, key); keyMsg = r.msg; setTimeout(() => { keyMsg = ''; }, 10000); if (lastD) render(lastD); return; }
  const cl = e.target.closest('button[data-keyclear]');
  if (cl) { const r = await api.clearKey(cl.dataset.keyclear); keyMsg = r.msg || ''; if (lastD) render(lastD); return; }
  if (e.target.closest('button[data-refreshspend]')) { e.target.disabled = true; await api.refreshSpend(); e.target.disabled = false; return; }
  const u = e.target.closest('button[data-unload]');
  if (u) { u.disabled = true; const r = await api.unloadModel({ runtime: u.dataset.rt, model: u.dataset.unload }); u.textContent = r.ok ? '✓' : '!'; u.title = r.msg; return; }
  const b =e.target.closest('button[data-pid]'); if (!b) return;
  b.disabled = true;
  const r = await api.kill({ pid: +b.dataset.pid, name: b.dataset.name, memMB: +b.dataset.mem, project: b.dataset.proj, cpu: b.dataset.cpu ? +b.dataset.cpu : undefined });
  b.disabled = false; if (!r.ok) b.title = r.msg;
});
api.onStats(render);
</script></body></html>
