<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
:root{--bg:rgba(24,26,32,.92);--fg:#e8eaf0;--mut:#8b91a0;--line:rgba(255,255,255,.08);--ok:#22c55e;--warn:#facc15;--crit:#ef4444;--acc:#6aa3ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;padding:0;background:transparent;overflow:hidden;font:12px/1.35 "Segoe UI Variable","Segoe UI",sans-serif;color:var(--fg);user-select:none}
.card{height:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.hd{display:flex;align-items:center;gap:7px;font-weight:600;-webkit-app-region:drag}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px currentColor;color:var(--ok)}
.l1 .dot{background:var(--warn);color:var(--warn)}.l2 .dot{background:var(--crit);color:var(--crit)}
.hd small{margin-left:auto;color:var(--mut);font-weight:400}
.row{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px}
.row b{color:var(--mut);font-weight:500;font-size:11px}.row i{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:3px;background:var(--ok);transition:width .4s,background .3s}
.net{display:flex;justify-content:space-between;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11.5px}
.net em{font-style:normal;color:var(--fg)}
.gauge{display:block;margin:0 auto}
.gauge .t{fill:var(--mut);font-size:7px;text-anchor:middle}
#nd,#nu{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.ctl{display:flex;justify-content:space-between;margin-top:-1px}
.seg{display:inline-flex;gap:2px}
.seg button{background:rgba(255,255,255,.07);color:var(--mut);padding:1px 7px;border-radius:5px;font-size:10px;line-height:1.3}
.seg button:hover{background:rgba(255,255,255,.15)}
.seg button.on{background:rgba(106,163,255,.28);color:var(--fg)}
.res{height:66px;cursor:pointer}
.ctl .tst,.ctl .rep{background:rgba(255,255,255,.08);color:var(--fg);padding:1px 7px;border-radius:5px;font-size:10px;line-height:1.3}
.ctl .tst:hover,.ctl .rep:hover{background:rgba(255,255,255,.18)}
.ctl .tst.run{color:#facc15}
.ctl .rep.on{background:rgba(106,163,255,.28)}
.ctl .rep[disabled]{opacity:.35;pointer-events:none}
.ctl .mid{display:inline-flex;gap:3px}
.seg button{padding:1px 6px}
.widget .card{cursor:grab}.widget .hd{-webkit-app-region:no-drag}
/* panel */
.panel .card{padding:14px;gap:10px}
.panel .hd{font-size:14px}.panel .x{margin-left:auto;cursor:pointer;color:var(--mut);padding:0 4px;-webkit-app-region:no-drag}
.status{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
#app{height:100%}
.card{overflow:hidden}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;display:flex;flex-direction:column;gap:8px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
h4{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-top:2px}
.grp{background:rgba(255,255,255,.04);border-radius:10px;padding:6px 8px}
.grp>summary{display:flex;gap:8px;cursor:pointer;list-style:none;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .n{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp>summary .m{color:var(--mut);font-variant-numeric:tabular-nums}
.p{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--line)}
.p:first-of-type{margin-top:6px}
.p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .nm small{color:var(--mut);margin-left:4px}
.chip{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(106,163,255,.15);color:var(--acc)}
.flag{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(239,68,68,.18);color:#ff8a8a;white-space:nowrap}
.p .v{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
input{font:inherit;font-size:11px;flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:rgba(0,0,0,.25);color:var(--fg);user-select:text}
button.ok{background:rgba(34,197,94,.2);color:#8be3a8}button.ok:hover{background:rgba(34,197,94,.35)}
button{font:inherit;font-size:11px;border:0;border-radius:6px;padding:2px 8px;background:rgba(239,68,68,.2);color:#ff9a9a;cursor:pointer}
button:hover{background:rgba(239,68,68,.35)}
.sus{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.07)}
.ss{display:flex;gap:8px;align-items:center;padding:2px 0}.ss .nm{flex:1}.ss .v{color:var(--mut)}
.on{width:7px;height:7px;border-radius:50%;background:var(--ok)}.off{width:7px;height:7px;border-radius:50%;background:#555}
.empty{color:var(--mut);padding:4px 0}
</style></head>
<body><div id="app"></div>
<script>
const view = new URLSearchParams(location.search).get('view');
document.body.className = view;
const $ = s => document.querySelector(s);

const fmtB = v => v > 1048576 ? (v / 1048576).toFixed(1) + ' МБ/с' : v > 1024 ? (v / 1024).toFixed(0) + ' КБ/с' : v.toFixed(0) + ' Б/с';
const fmtMem = m => m >= 1024 ? (m / 1024).toFixed(1) + ' ГБ' : m + ' МБ';
const fmtAge = m => m >= 1440 ? Math.floor(m / 1440) + 'д' : m >= 60 ? Math.floor(m / 60) + 'ч' : m + 'м';
const col = (v, c) => v >= c.crit ? 'var(--crit)' : v >= c.warn ? 'var(--warn)' : 'var(--ok)';

// Network indicator: 3 styles (dial / graph / bars) x 3 channels (both / download / upload).

let gStyle = lsGet('pcm.style', 'dial'), gCh = lsGet('pcm.ch', 'both');
const samples = [], hist = [];
let prevD = 0, prevU = 0, prevBD = 0, prevBU = 0, lastSeq = null;
const C_D = '#e8eaf0', C_U = '#6aa3ff', BARW = 130;
function pushSample(rx, tx) { const now = Date.now(); samples.push({ t: now, rx, tx }); while (samples[0].t < now - 4500) samples.shift(); hist.push({ rx, tx }); if (hist.length > 90) hist.shift(); }
const avgOf = k => samples.reduce((a, x) => a + x[k], 0) / samples.length;
const posOf = v => Math.max(0, Math.min(1, Math.log10(Math.max(v, 1000) / 1000) / 5));
const showD = () => gCh !== 'tx', showU = () => gCh !== 'rx';
const CX = 100, CY = 54, R = 44;
const pt = (p, r) => { const a = Math.PI * (1 - p); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; };
function dialSvg(dDeg, uDeg) {

  const label = single ? `<text x="${CX}" y="63" text-anchor="middle" font-size="8" fill="${gCh === 'rx' ? C_D : C_U}">${gCh === 'rx' ? '↓' : '↑'} ${fmtB(avgOf(gCh))}</text>` : '';
  return `<svg class="gauge" width="206" height="66" viewBox="0 0 200 64">${arc(0, .6, '#22c55e')}${arc(.6, .85, '#facc15')}${arc(.85, 1, '#ef4444')}${ticks}
  ${showU() ? needle('nu', uDeg, single ? 40 : 34, C_U, single ? 2 : 1.3) : ''}${showD() ? needle('nd', dDeg, 40, C_D, 2) : ''}

}
function graphSvg() {

  for (const [k, c] of chs) {
    const v = series(k); if (v.length < 2) continue;
    const pts = v.map((y, i) => [2 + (N - v.length + i) / (N - 1) * 196, B - y / max * (B - T)]);
    const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
    if (chs.length === 1) g += `<path d="${d}L${pts[pts.length - 1][0].toFixed(1)} ${B}L${pts[0][0].toFixed(1)} ${B}Z" fill="${c}" opacity=".15"/>`;
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<text class="t" x="3" y="8" style="text-anchor:start">макс ${fmtB(max)}</text><text class="t" x="197" y="8" style="text-anchor:end">≈3 мин</text>`;

function barsSvg(bd, bu) {

  let g = '';

  });
  [['1K', 0], ['1M', .6], ['100M', 1]].forEach(([l, p]) => { g += `<text class="t" x="${16 + p * BARW}" y="62" style="text-anchor:${p === 0 ? 'start' : p === 1 ? 'end' : 'middle'}">${l}</text>`; });
  return `<svg class="gauge" width="206" height="66" viewBox="0 0 200 64">${g}</svg>`;
}
const netControls = st => `<div class="ctl"><span class="seg">${[['both', '↓↑', 'Скачивание и отправка'], ['rx', '↓', 'Только скачивание'], ['tx', '↑', 'Только отправка']].map(([v, t, h]) => `<button data-ch="${v}" title="${h}" class="${gCh === v ? 'on' : ''}">${t}</button>`).join('')}</span>${speedControls(st)}<span class="seg">${[['dial', '◔', 'Стрелка'], ['graph', '⌇', 'График'], ['bars', '▤', 'Полосы']].map(([v, t, h]) => `<button data-gs="${v}" title="${h}" class="${gStyle === v ? 'on' : ''}">${t}</button>`).join('')}</span></div>`;
// ---- internet speed test: two analog dials (download = "чтение", upload = "передача"), stage by stage ----
let reportOpen = false, dismissedAt = 0, prevSD = 0, prevSU = 0;
const posM = v => Math.max(0, Math.min(1, Math.log10(Math.max(v || 0, 1)) / 3));   // 1 .. 1000 Mbit/s, log scale
const fmtMb = v => v == null ? '—' : (v >= 100 ? String(Math.round(v)) : v.toFixed(1).replace('.', ','));
const ptc = (cx, cy, r, p) => { const a = Math.PI * (1 - p); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
function miniDial(cx, id, deg, color, title, val, dim) {
  const cy = 50, r = 29, [x1, y1] = ptc(cx, cy, r, 0), [x2, y2] = ptc(cx, cy, r, 1);
  let ticks = '';
  [[0, '1'], [1 / 3, '10'], [2 / 3, '100'], [1, '1000']].forEach(([p, l]) => { const [a, b] = ptc(cx, cy, r - 1, p), [c, d] = ptc(cx, cy, r + 4, p), [tx, ty] = ptc(cx, cy, r + 9, p); ticks += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#8b91a0" stroke-width=".8"/><text class="t" style="font-size:5.5px" x="${tx}" y="${ty + 2}">${l}</text>`; });
  return `<g opacity="${dim ? .35 : 1}"><text x="${cx}" y="19" text-anchor="middle" font-size="7.5" fill="${color}">${title}</text>
  <path d="M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}" stroke="${color}" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".35"/>${ticks}
  <g id="${id}" style="transform-origin:${cx}px ${cy}px;transform:rotate(${deg}deg);transition:transform 1s cubic-bezier(.2,.8,.2,1)"><line x1="${cx}" y1="${cy}" x2="${cx - 25}" y2="${cy}" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></g>
  <circle cx="${cx}" cy="${cy}" r="3" fill="${color}"/><text x="${cx}" y="62" text-anchor="middle" font-size="8.5" fill="${C_D}">${val}</text></g>`;
}
function speedModel(st) {
  const r = st.result || {}, p = st.partial || {};
  let down = null, up = null, stage = '', dDim = false, uDim = false;
  if (st.running) {
    if (st.phase === 'ping') { stage = 'Этап 1/3 · Пинг…'; dDim = uDim = true; }
    else if (st.phase === 'down') { stage = `Этап 2/3 · Чтение (скачивание) · пинг ${p.pingMs} мс`; down = st.live; uDim = true; }
    else { stage = 'Этап 3/3 · Передача (отправка)'; down = p.down; up = st.live; }
  } else if (r.error) { stage = r.error; dDim = uDim = true; }
  else { stage = `Готово · пинг ${r.pingMs} мс · джиттер ${r.jitterMs} мс`; down = r.down; up = r.up; }

function speedView(st) {

  const html = `<svg class="gauge" width="212" height="66" viewBox="0 0 200 64"><text x="100" y="8" text-anchor="middle" font-size="7.5" fill="#8b91a0">${esc(m.stage)}</text>
  ${miniDial(50, 'sd', prevSD, C_D, '↓ Чтение', m.down == null ? '—' : fmtMb(m.down) + ' Мбит/с', m.dDim)}${miniDial(150, 'su', prevSU, C_U, '↑ Передача', m.up == null ? '—' : fmtMb(m.up) + ' Мбит/с', m.uDim)}</svg>`;

const speedControls = st => `<span class="mid"><button class="tst ${st.running ? 'run' : ''}" data-speed="1" ${st.running ? 'disabled' : ''} title="Тест скорости интернета (пинг, скачивание, отправка)">${st.running ? '⏳ Идёт…' : '⚡ Тест'}</button><button class="rep ${reportOpen ? 'on' : ''}" data-report="1" ${st.result ? '' : 'disabled'} title="Отчёт последнего теста">📋</button></span>`;

  h += (st.history || []).filter(x => !x.error).slice(0, 5).map(x => `<div class="ss"><span class="nm" style="color:var(--mut)">${HIST_TIME(x.at)}</span><span class="v">↓ ${fmtMb(x.down)} · ↑ ${fmtMb(x.up)} Мбит/с · ${x.pingMs} мс</span></div>`).join('');
  h += '<div class="ss"><span class="nm" style="color:var(--mut);white-space:normal">Тест идёт через speed.cloudflare.com и расходует до ~150 МБ трафика.</span></div></div>';

}
const fmtTok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);

function usageBlock(us, bud) {

  h += `<div class="ss"><span class="nm"><b>Claude Code</b></span><span class="v">${c.today.msgs} ответов сегодня</span></div>`;
  h += row('Сегодня', c.today, bud.claudeDay, true) + row('Последние 5 ч', c.h5, bud.claude5h, true) + row('7 дней', c.d7, bud.claudeWeek, true) + projs(c);

    h += `<div class="ss" style="margin-top:6px"><span class="nm"><b>Codex</b>${x.limits && x.limits.plan ? '<small style="color:var(--mut);margin-left:4px">' + esc(x.limits.plan) + '</small>' : ''}</span><span class="v">${x.today.msgs} запросов сегодня</span></div>`;

let keyMsg = '', lastD = null;
const money = v => '$' + v.toFixed(2);
function spendBlock(sp, keys, bud) {

  let h = '<h4>Расход по API (организация)</h4><div class="grp">', any = false;
  for (const p of ['anthropic', 'openai']) {
    const k = keys[p]; if (!k || !k.configured) continue; any = true;
    const d = sp[p];
    h += `<div class="ss"><span class="nm"><b>${esc(k.name)}</b></span><span class="v">${d && d.at ? 'обновлено ' + new Date(d.at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) : d && d.error ? '' : 'загрузка…'}</span></div>`;
    if (d && d.error) h += `<div class="ss"><span class="nm" style="color:#ff8a8a;white-space:normal">${esc(d.error)}</span></div>`;
    if (d && d.month) {
      const b = bud[p === 'anthropic' ? 'anthropicMonth' : 'openaiMonth'] || 0;
      h += `<div class="ss"><span class="nm">Месяц (UTC)</span><span class="v">${money(d.month.cost)} · вх ${fmtTok(d.month.in)} · вых ${fmtTok(d.month.out)}</span></div>${b > 0 ? tokBar(d.month.cost, b) : ''}`;
      h += `<div class="ss"><span class="nm">7 дней</span><span class="v">${money(d.d7.cost)}</span></div>`;
      if (d.today) h += `<div class="ss"><span class="nm">Сегодня</span><span class="v">${money(d.today.cost)}</span></div>`;
      h += d.models.map(m => `<div class="ss"><span class="nm" style="color:var(--mut)">${esc(m.model)}</span><span class="v">${m.cost != null && p === 'anthropic' ? money(m.cost) + ' · ' : ''}${fmtTok(m.in)} / ${fmtTok(m.out)}</span></div>`).join('');
      if (d.dataAsOf) h += `<div class="ss"><span class="nm" style="color:var(--mut);white-space:normal">Данные Anthropic на ${new Date(d.dataAsOf).toLocaleString('ru', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} (задержка до 24 ч)</span></div>`;
    }
  }
  if (!any) h += '<div class="empty">Ключи не подключены — добавьте их ниже (нужны Admin-ключи организации).</div>';
  h += '</div>';
  const kopen = document.querySelector('details[data-k="keys"]') ? document.querySelector('details[data-k="keys"]').open : false;
  h += `<details class="grp" data-k="keys" ${kopen ? 'open' : ''}><summary><span class="n">Ключи API (Admin)</span><span class="m">шифруются Windows</span></summary>`;
  for (const p of ['anthropic', 'openai']) {
    const k = keys[p]; if (!k) continue;
    h += k.configured
      ? `<div class="ss"><span class="nm">${esc(k.name)} · ключ задан ${esc(k.hint)}</span><button data-keyclear="${p}">Удалить</button></div>`
      : `<div class="ss"><input type="password" autocomplete="off" spellcheck="false" data-keyin="${p}" placeholder="${p === 'anthropic' ? 'Anthropic Admin-ключ sk-ant-admin…' : 'OpenAI Admin-ключ sk-…'}"><button class="ok" data-keysave="${p}">Сохранить</button></div>`;
  }
  h += `<div class="ss"><span class="nm" style="color:var(--mut);white-space:normal">${keyMsg ? esc(keyMsg) : 'Ключ хранится только на этом ПК в зашифрованном виде и уходит только на api.anthropic.com / api.openai.com. Админ-ключ создаётся в консоли организации; для работы нужна организация, а не личный аккаунт.'}</span></div><div class="ss"><button data-refreshspend="1">Обновить расход</button></div></details>`;
  return h;
}
const STATUS = ['Всё в порядке', 'Повышенная нагрузка', 'Перегрузка'];

function render(d) {
  lastD = d;
  if (view === 'panel' && document.activeElement && document.activeElement.tagName === 'INPUT') return;   // don't wipe a key being typed
  const { stats: s, level, worst, analysis: a, cfg, usage: us } = d, c = cfg;
  const m = metric('CPU', s.cpu, c) + metric('RAM', s.ram, c) + metric('GPU', s.gpu, c) + metric('Диск', s.disk, { warn: 85, crit: 95 });
  if (view === 'widget') {
    if (d.seq !== lastSeq) { pushSample(s.rx, s.tx); lastSeq = d.seq; }
    const st = d.speedtest || {};
    const showSpeed = st.running || (st.result && ((reportOpen) || (st.result.at !== dismissedAt && Date.now() - st.result.at < 25000)));
    const sv = showSpeed ? speedView(st) : null;
    const pd = posOf(avgOf('rx')), pu = posOf(avgOf('tx'));
    const ind = sv ? `<div class="res" data-dismiss="1">${sv.html}</div>` : gStyle === 'graph' ? graphSvg() : gStyle === 'bars' ? barsSvg(prevBD, prevBU) : dialSvg(prevD, prevU);
    $('#app').innerHTML = `<div class="card l${level}" id="w"><div class="hd"><span class="dot"></span>PC Monitor<small>${level ? esc(worst.name) + ' ' + worst.v.toFixed(0) + '%' : 'ОК'}</small></div>${m}<div class="net"><span>↓ <em>${fmtB(s.rx)}</em></span><span>↑ <em>${fmtB(s.tx)}</em></span></div>${ind}${netControls(st)}</div>`;
    const anim = (el, fn) => { if (el) { el.getBoundingClientRect(); fn(el); } };   // reflow first so the CSS transition runs from the previous value
    if (sv) { anim($('#sd'), e => { e.style.transform = `rotate(${sv.tgtD}deg)`; }); anim($('#su'), e => { e.style.transform = `rotate(${sv.tgtU}deg)`; }); prevSD = sv.tgtD; prevSU = sv.tgtU; }
    if (!sv && gStyle === 'dial') { anim($('#nd'), e => { e.style.transform = `rotate(${pd * 180}deg)`; }); anim($('#nu'), e => { e.style.transform = `rotate(${pu * 180}deg)`; }); }
    if (!sv && gStyle === 'bars') { anim($('#bd'), e => { e.style.width = pd * BARW + 'px'; }); anim($('#bu'), e => { e.style.width = pu * BARW + 'px'; }); }
    prevD = pd * 180; prevU = pu * 180; prevBD = pd; prevBU = pu;
    return;
  }
  const sus = a ? a.suspects : [];
  const proc = (p, k) => `<div class="p"><span class="nm">${esc(p.name)}<small>${p.pid} · ${fmtAge(p.ageMin)}</small></span><span class="chip">${p.cat}</span>${p.flags.map(f => `<span class="flag">${esc(f)}</span>`).join('')}<span class="v">${fmtMem(p.memMB)} · ${p.cpu}%</span><button data-pid="${p.pid}" data-name="${esc(p.name)}" data-mem="${p.memMB}" data-proj="${esc(p.project || '')}">✕</button></div>`;
  const open = new Set([...document.querySelectorAll('details[open]')].map(x => x.dataset.k));
  const sc = $('.scroll'), top = sc ? sc.scrollTop : 0;
  $('#app').innerHTML = `<div class="card l${level}"><div class="hd"><span class="dot"></span>PC Monitor<small style="margin:0 auto 0 6px">v${esc(d.version || '')}</small><span class="x" id="x">✕</span></div>
  <div class="status">${STATUS[level]}${level ? ' — ' + esc(worst.name) + ' ' + worst.v.toFixed(0) + '%' : ''} · RAM ${s.ramUsedGB.toFixed(1)} / ${s.ramTotalGB.toFixed(0)} ГБ</div>
  <div class="grid">${m}</div>
  <div class="net"><span>↓ <em>${fmtB(s.rx)}</em></span><span>↑ <em>${fmtB(s.tx)}</em></span></div>
  <div class="scroll">${!a ? '<div class="empty">Сканирую процессы…</div>' : `
    ${sus.length ? `<h4>Подозрительные (${sus.length})</h4><div class="grp sus">${sus.map(proc).join('')}</div>` : ''}
    ${a.llm && (a.llm.tools.length || a.llm.local.length) ? `<h4>LLM: инструменты и модели</h4><div class="grp">
      ${a.llm.local.map(m => `<div class="ss"><span class="on"></span><span class="nm" title="${esc(m.model)}">${esc(m.runtime === 'ollama' ? 'Ollama' : 'LM Studio')} · ${esc(m.model)}</span><span class="v">${m.sizeMB ? fmtMem(m.sizeMB) + (m.vramMB ? ' (GPU ' + fmtMem(m.vramMB) + ')' : '') : 'загружена'}${m.expiresInMin != null ? ' · ещё ' + m.expiresInMin + 'м' : ''}</span>${m.runtime === 'ollama' ? `<button data-unload="${esc(m.model)}" data-rt="ollama">Выгрузить</button>` : ''}</div>`).join('')}
      ${a.llm.tools.map(t => `<div class="ss"><span class="nm">${esc(t.label)}<small style="color:var(--mut);margin-left:4px">${esc(t.kind)}</small></span><span class="v">${t.procs} проц. · ${fmtMem(t.memMB)} · ${t.cpu}% · ${fmtAge(t.ageMin)}</span></div>`).join('')}</div>` : ''}
    ${speedBlock(d.speedtest)}
    ${usageBlock(us, c.budgets)}
    ${spendBlock(d.spend, d.keys, c.budgets)}
    <h4>Проекты и процессы</h4>
    ${a.groups.map(g => `<details class="grp" data-k="${esc(g.key)}" ${open.has(g.key) ? 'open' : ''}><summary><span class="n">${esc(g.name)}</span><span class="m">${g.procs.length} · ${fmtMem(g.memMB)} · ${g.cpu}%</span></summary>${g.procs.map(proc).join('')}</details>`).join('') || '<div class="empty">Нет данных</div>'}
    ${a.browsers.length ? `<h4>Браузеры</h4><div class="grp">${a.browsers.map(b => `<div class="ss"><span class="nm">${esc(b.name)}</span><span class="v">${b.count} проц. · ${fmtMem(b.memMB)} · ${b.cpu.toFixed(0)}%</span></div>`).join('')}</div>` : ''}
    ${a.sessions.length ? `<h4>LLM-сессии (CLI)</h4><div class="grp">${a.sessions.map(x => `<div class="ss"><span class="${x.active ? 'on' : 'off'}"></span><span class="nm" title="${esc(x.cwd)}">${esc(x.name)}<small style="color:var(--mut);margin-left:4px">${esc(x.tool || '')}</small></span><span class="v">${x.active ? 'активна' : fmtAge(Math.round((Date.now() - x.last) / 60000)) + ' назад'}</span></div>`).join('')}</div>` : ''}`}
  </div></div>`;
  const ns = $('.scroll'); if (ns) ns.scrollTop = top;
  $('#x').onclick = () => api.closePanel();
}

if (view === 'widget') {
  document.addEventListener('contextmenu', e => { e.preventDefault(); api.widgetMenu(); });
  document.addEventListener('dblclick', e => { if (!e.target.closest('.ctl, .res')) api.openPanel(); });
  // drag the widget by any point (JS-based so right-click and double-click keep working)
  let dragging = false;
  document.addEventListener('pointerdown', e => { if (e.button !== 0 || e.target.closest('.ctl, .res')) return; dragging = true; document.body.setPointerCapture(e.pointerId); api.drag('start', e.screenX, e.screenY); });
  document.addEventListener('pointermove', e => { if (dragging) api.drag('move', e.screenX, e.screenY); });
  const end = e => { if (dragging) { dragging = false; api.drag('end', e.screenX, e.screenY); } };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
}
document.addEventListener('click', async e => {
  if (e.target.closest('button[data-speed]')) { api.speedStart(); return; }
  if (e.target.closest('button[data-report]')) { reportOpen = !reportOpen; if (reportOpen) dismissedAt = 0; if (lastD) render(lastD); return; }
  if (e.target.closest('[data-dismiss]')) { const st = lastD && lastD.speedtest; if (st && !st.running) { dismissedAt = st.result ? st.result.at : 0; reportOpen = false; if (lastD) render(lastD); } return; }
  const chb = e.target.closest('button[data-ch]');
  if (chb) { gCh = chb.dataset.ch; lsSet('pcm.ch', gCh); if (lastD) render(lastD); return; }
  const gsb = e.target.closest('button[data-gs]');
  if (gsb) { gStyle = gsb.dataset.gs; lsSet('pcm.style', gStyle); if (lastD) render(lastD); return; }
  const sv = e.target.closest('button[data-keysave]');
  if (sv) { const p = sv.dataset.keysave, inp = document.querySelector(`input[data-keyin="${p}"]`); const key = inp ? inp.value : ''; if (inp) inp.value = ''; sv.disabled = true; const r = await api.setKey(p, key); keyMsg = r.msg; setTimeout(() => { keyMsg = ''; }, 10000); if (lastD) render(lastD); return; }
  const cl = e.target.closest('button[data-keyclear]');
  if (cl) { const r = await api.clearKey(cl.dataset.keyclear); keyMsg = r.msg || ''; if (lastD) render(lastD); return; }
  if (e.target.closest('button[data-refreshspend]')) { e.target.disabled = true; await api.refreshSpend(); e.target.disabled = false; return; }
  const u = e.target.closest('button[data-unload]');
  if (u) { u.disabled = true; const r = await api.unloadModel({ runtime: u.dataset.rt, model: u.dataset.unload }); u.textContent = r.ok ? '✓' : '!'; u.title = r.msg; return; }
  const b =e.target.closest('button[data-pid]'); if (!b) return;
  b.disabled = true;
  const r = await api.kill({ pid: +b.dataset.pid, name: b.dataset.name, memMB: +b.dataset.mem, project: b.dataset.proj });
  b.disabled = false; if (!r.ok) b.title = r.msg;
});
api.onStats(render);
</script></body></html>
